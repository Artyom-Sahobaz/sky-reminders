<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<style>
  @font-face { font-family: "Inter"; src: url("fonts/inter-var.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
  body { -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01", "ss03"; letter-spacing: -0.006em; }
  h1, h2 { letter-spacing: -0.022em; }
  :root {
    --ink: #2b2d42;
    --muted: #6b6f86;
    --cream: #fffaf2;
    --coral: #ff6b6b;
    --sun: #ffd166;
    --sky: #4cc9f0;
    --mint: #06d6a0;
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--ink); }

  .flight { position: absolute; will-change: transform; }
  .flight.open { z-index: 10; }
  .bob { position: relative; }
  .idle .bob { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }

  /* ---------- vehicles ---------- */
  .craft { cursor: pointer; filter: drop-shadow(0 6px 10px rgba(43,45,66,.22)); }
  .craft svg { flex: none; display: block; }
  .prop { animation: spin .12s linear infinite; }
  @keyframes spin { 0% { transform: scaleY(1) } 50% { transform: scaleY(.15) } 100% { transform: scaleY(1) } }
  .rotor { animation: rotor .16s linear infinite; }
  @keyframes rotor { 0% { transform: scaleX(1) } 50% { transform: scaleX(.12) } 100% { transform: scaleX(1) } }
  .tailrotor { animation: spin .1s linear infinite; }
  .wheel { transform-box: fill-box; transform-origin: center; animation: roll .55s linear infinite; }
  @keyframes roll { to { transform: rotate(-360deg) } }
  .idle .wheel { animation-play-state: paused; }
  .waves { animation: waves 1.3s linear infinite; }
  @keyframes waves { to { transform: translateX(20px) } }

  /* tow: banner trailing behind */
  .tow .craft { display: flex; align-items: center; }
  .rope { width: 46px; height: 2px; background: #8a7f72; margin-left: -6px; flex: none; }
  .banner {
    position: relative; padding: 11px 34px 11px 18px; background: var(--sun); color: var(--ink);
    font-weight: 600; font-size: 15px; white-space: nowrap; max-width: 360px; overflow: hidden; text-overflow: ellipsis;
    clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 50%, 100% 100%, 0 100%);
    transform-origin: left center; animation: flutter 1.1s ease-in-out infinite;
    border-left: 4px solid #e9b949;
  }
  .banner small { font-weight: 600; color: #7a5a00; margin-left: 6px; }
  /* long titles shorten; the account tag and countdown always stay visible */
  .banner { display: flex; align-items: center; max-width: 440px; }
  .banner [data-title] { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .banner small, .banner .who { flex: none; }
  @keyframes flutter { 0%, 100% { transform: skewY(0deg) scaleY(1) } 50% { transform: skewY(-2.2deg) scaleY(.96) } }

  /* tag: hanging name tag (balloon) */
  .tag-kind .craft { display: flex; flex-direction: column; align-items: center; }
  .v-balloon.idle .bob { animation: sway 4s ease-in-out infinite; transform-origin: 50% 0; }
  @keyframes sway { 0%, 100% { transform: translateY(0) rotate(-2.5deg) } 50% { transform: translateY(-10px) rotate(2.5deg) } }
  .tag {
    margin-top: 2px; background: var(--cream); border: 2px solid var(--coral); border-radius: 12px;
    padding: 6px 12px; font-size: 13px; font-weight: 600; text-align: center; max-width: 200px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tag small { display: block; font-weight: 600; color: var(--coral); }

  /* bubble: speech bubble above (ground vehicles) */
  .bubble .craft { display: flex; flex-direction: column; align-items: center; }
  .say {
    position: relative; margin-bottom: 12px; background: #fff; border-radius: 14px; padding: 8px 14px;
    font-size: 14px; font-weight: 600; max-width: 240px; text-align: center; white-space: nowrap;
    box-shadow: 0 0 0 1.5px rgba(43,45,66,.08);
  }
  .say span { display: block; overflow: hidden; text-overflow: ellipsis; }
  .say small { display: block; color: var(--coral); font-weight: 600; font-size: 12.5px; }
  .say-tail { position: absolute; left: 50%; bottom: -8px; width: 16px; height: 10px; margin-left: -8px; background: #fff; clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .ground.idle .bob { animation: idle-rumble .45s ease-in-out infinite; }
  @keyframes idle-rumble { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-1.5px) } }
  .v-bike.idle .bob { animation: none; }
  .v-boat.idle .bob { animation: rock 3s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes rock { 0%, 100% { transform: rotate(-2.5deg) } 50% { transform: rotate(2.5deg) translateY(-3px) } }

  /* ---------- details card ---------- */
  .card {
    position: absolute; width: 340px; background: var(--cream); border-radius: 18px; padding: 18px 18px 14px;
    box-shadow: 0 18px 40px rgba(43,45,66,.28), 0 0 0 1px rgba(43,45,66,.06);
    opacity: 0; transform: translateY(-8px) scale(.97); pointer-events: none; transition: opacity .18s, transform .18s;
    cursor: default; user-select: text;
  }
  .open .card { opacity: 1; transform: none; pointer-events: auto; }
  .tow .card { top: calc(100% + 10px); right: 0; }
  .tag-kind .card { top: 10px; right: calc(100% + 14px); }
  .bubble .card { bottom: calc(100% + 10px); right: 0; transform: translateY(8px) scale(.97); }
  .open.bubble .card { transform: none; }
  .bubble.card-below .card { bottom: auto; top: calc(100% + 10px); }
  .card h2 { margin: 0 26px 4px 0; font-size: 18px; line-height: 1.25; }
  .when { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .count { display: inline-block; background: var(--coral); color: white; font-weight: 600; border-radius: 999px; padding: 2px 10px; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .row { font-size: 13px; margin: 6px 0; display: flex; gap: 8px; }
  .row b { color: var(--muted); font-weight: 600; min-width: 64px; }
  .row span { overflow-wrap: anywhere; }
  .desc { font-size: 13px; white-space: pre-wrap; max-height: 130px; overflow: auto; background: #fff; border-radius: 10px; padding: 8px 10px; margin: 10px 0 4px; color: #44475e; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  button {
    font: inherit; font-size: 14px; font-weight: 600; border: 0; border-radius: 12px; padding: 9px 14px; cursor: pointer;
    background: #efe7da; color: var(--ink); transition: transform .1s, filter .1s;
  }
  button:hover { filter: brightness(.96); }
  button:active { transform: scale(.96); }
  button.join { background: var(--mint); color: #053b2e; flex: 1; }
  .actions button { white-space: nowrap; padding: 9px 12px; }
  button.cancel { background: transparent; color: #c0392b; box-shadow: inset 0 0 0 1.5px #f1c4bf; }
  button.cancel:hover { background: #fdecea; filter: none; }
  .x { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; padding: 0; border-radius: 50%; font-size: 16px; line-height: 28px; background: transparent; color: var(--muted); }
  .x:hover { background: #efe7da; }
  /* which calendar/account the reminder is for */
  .who {
    display: inline-block; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: 1px;
    background: var(--acct, #4f7cff); color: #fff; font-size: 11.5px; font-weight: 600; letter-spacing: 0;
    border-radius: 999px; padding: 2px 9px; margin-right: 9px;
  }
  .who[hidden] { display: none; }
  .say .who, .tag .who { display: block; width: fit-content; margin: 0 auto 4px; }
  .say .who[hidden], .tag .who[hidden] { display: none; }
  .flight[style*="--acct"] .banner { border-left-color: var(--acct); }
  .flight[style*="--acct"] .say { box-shadow: 0 0 0 2px var(--acct); }
  .flight[style*="--acct"] .say-tail { background: var(--acct); }
  .flight[style*="--acct"] .tag { border-color: var(--acct); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }
  .acct-mail { color: var(--muted); font-style: normal; }
  .craft { position: relative; }
  .zzz {
    position: absolute; left: 50%; top: -6px; transform: translateX(-50%); white-space: nowrap;
    background: var(--ink); color: #fff; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 5px 12px;
    animation: pop .25s ease-out both;
  }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, 6px) scale(.8) } to { opacity: 1; transform: translate(-50%, 0) } }
</style>
</head>
<body>
<script src="vehicles.js"></script>
<script>
  const W = () => window.innerWidth;
  const H = () => window.innerHeight;
  const active = new Map(); // id -> {el, r, slot}
  const SLOT = { sky: 200, ground: 215 };

  // ---- click-through: only the flying things catch the mouse ----
  let interactive = false;
  document.addEventListener('mousemove', (e) => {
    const on = !!(e.target && e.target.closest && e.target.closest('.hit'));
    if (on !== interactive) { interactive = on; window.sky.setInteractive(on); }
  });

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  const fmtTime = (t) => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  function countdown(start) {
    const s = Math.round((start - Date.now()) / 1000);
    if (s > 0) {
      const m = Math.floor(s / 60), r = s % 60;
      return m >= 1 ? `in ${m}:${String(r).padStart(2, '0')}` : `in ${r}s`;
    }
    const ago = Math.floor(-s / 60);
    return ago < 1 ? 'starting now' : `started ${ago} min ago`;
  }
  const shortCount = (start) => {
    const m = Math.ceil((start - Date.now()) / 60000);
    return m > 0 ? `in ${m} min` : 'now!';
  };

  function freeSlot(lane) {
    const used = new Set([...active.values()].filter((a) => a.lane === lane).map((a) => a.slot));
    let i = 0;
    while (used.has(i)) i++;
    return i;
  }

  function cardHtml(r) {
    const rows = [];
    if (r.accountName) {
      const sub = r.accountEmail && r.accountEmail !== r.accountName ? ` <i class="acct-mail">${esc(r.accountEmail)}</i>` : '';
      rows.push(`<div class="row"><b>Calendar</b><span><i class="dot" style="background:${esc(r.accountColor || '#4f7cff')}"></i>${esc(r.accountName)}${sub}</span></div>`);
    }
    if (r.location) rows.push(`<div class="row"><b>Where</b><span>${esc(r.location)}</span></div>`);
    if (r.organizer) rows.push(`<div class="row"><b>Organizer</b><span>${esc(r.organizer)}</span></div>`);
    if (r.attendees && r.attendees.length) rows.push(`<div class="row"><b>Guests</b><span>${esc(r.attendees.join(', '))}</span></div>`);
    if (r.link) rows.push(`<div class="row"><b>Link</b><span>${esc(r.link)}</span></div>`);
    return `
      <div class="card hit">
        <button class="x" data-act="dismiss" title="Dismiss">✕</button>
        <h2>${esc(r.title)}</h2>
        <div class="when"><span class="count" data-count></span>${fmtTime(r.start)} – ${fmtTime(r.end)}</div>
        ${rows.join('')}
        ${r.description ? `<div class="desc">${esc(r.description)}</div>` : ''}
        <div class="actions">
          ${r.link ? `<button class="join" data-act="join">Join meeting</button>` : `<button class="join" data-act="calendar">Open calendar</button>`}
          <button data-act="snooze">Snooze 2 min</button>
          <button class="cancel" data-act="cancel" title="Close and don't remind me again about this meeting">Cancel</button>
        </div>
      </div>`;
  }

  function show(r) {
    if (active.has(r.id)) remove(r.id, true);
    const V = VEHICLES[r.style] || VEHICLES.plane;
    const slot = freeSlot(V.lane);
    const el = document.createElement('div');
    el.className = `flight ${V.lane} ${V.kind === 'tag' ? 'tag-kind' : V.kind} v-${r.style}`;
    const label = `<b class="who" hidden></b><span data-title></span><small data-short></small>`;
    let craft;
    if (V.kind === 'tow') craft = `${V.svg}<div class="rope"></div><div class="banner">${label}</div>`;
    else if (V.kind === 'tag') craft = `${V.svg}<div class="tag">${label}</div>`;
    else craft = `<div class="say">${label}<div class="say-tail"></div></div>${V.svg}`;
    el.innerHTML = `<div class="bob"><div class="craft hit" data-act="toggle">${craft}</div>${cardHtml(r)}</div>`;
    el.querySelector('[data-title]').textContent = r.title;
    const who = el.querySelector('.who');
    if (r.showAccount && r.accountName) {
      who.hidden = false;
      who.textContent = r.accountName;
      who.title = r.accountEmail || r.accountName;
      el.style.setProperty('--acct', r.accountColor || '#4f7cff');
    }
    document.body.appendChild(el);
    const entry = { el, r, slot, lane: V.lane, V };
    active.set(r.id, entry);
    update(entry);

    // rest position (measured after the text is filled in)
    const w = el.offsetWidth, h = el.offsetHeight;
    const left = Math.max(20, W() - w - 32);
    el.style.left = left + 'px';
    el.style.top = (V.lane === 'sky' ? 24 + slot * SLOT.sky : H() - h - 14 - slot * SLOT.ground) + 'px';
    entry.left = left;

    const from = V.enter === 'bottom' ? `translate(0, ${H()}px)` : `translate(${w + 60}px, ${V.lane === 'sky' ? -30 : 0}px)`;
    const duration = V.enter === 'bottom' ? 3200 : r.style === 'boat' ? 3600 : V.lane === 'ground' ? 2800 : 2400;
    const anim = el.animate(
      [{ transform: from }, { transform: 'translate(0,0)' }],
      { duration, easing: 'cubic-bezier(.2,.8,.25,1)', fill: 'forwards' }
    );
    anim.onfinish = () => el.classList.add('idle');

    // Single click on the plane/balloon opens the card; double click snoozes.
    // The single click waits a moment so a double click doesn't flash the card first.
    let clickTimer = null;
    el.addEventListener('dblclick', (e) => {
      if (!e.target.closest('.craft')) return;
      clearTimeout(clickTimer);
      clickTimer = null;
      snoozeWithBubble(r, el);
    });
    el.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const act = btn.dataset.act;
      if (act === 'toggle') {
        if (e.detail > 1) return; // second click of a double click
        clickTimer = setTimeout(() => {
          clickTimer = null;
          const opening = !el.classList.contains('open');
          document.querySelectorAll('.flight.open').forEach((o) => o.classList.remove('open'));
          if (opening) {
            // ground vehicles open their card upwards, unless there is no room above
            el.classList.toggle('card-below', el.getBoundingClientRect().top < 380);
            el.classList.add('open');
          }
        }, 260);
      }
      if (act === 'join') { window.sky.openLink(r.link); remove(r.id); }
      if (act === 'calendar') { window.sky.openLink(r.calendarUrl || 'https://calendar.google.com/calendar/r'); remove(r.id); }
      if (act === 'snooze') { window.sky.snooze(r.id, 2); remove(r.id); }
      if (act === 'cancel') { window.sky.cancelReminders(r.id); remove(r.id); }
      if (act === 'dismiss') remove(r.id);
    });

    if (r.sound) chime(V.notes);
  }

  function snoozeWithBubble(r, el) {
    if (!active.has(r.id)) return;
    const b = document.createElement('div');
    b.className = 'zzz';
    b.textContent = 'Snoozed 2 min 💤';
    el.querySelector('.craft').appendChild(b);
    window.sky.snooze(r.id, 2);
    setTimeout(() => remove(r.id), 700);
  }

  function update(entry) {
    const { el, r } = entry;
    el.querySelector('[data-short]').textContent = (entry.V.kind === 'tow' ? ' · ' : '') + shortCount(r.start);
    el.querySelector('[data-count]').textContent = countdown(r.start);
  }

  function remove(id, instant) {
    const entry = active.get(id);
    if (!entry) return;
    active.delete(id);
    const { el, V, left } = entry;
    el.classList.remove('open', 'idle');
    window.sky.setInteractive(false); interactive = false;
    const done = () => { el.remove(); if (!active.size) window.sky.empty(); };
    if (instant) return done();
    const to = V.exit === 'up'
      ? `translate(30px, ${-H()}px)`
      : `translate(${-(left + el.offsetWidth + 80)}px, ${V.lane === 'sky' ? -60 : 0}px)`;
    el.animate([{ transform: 'translate(0,0)' }, { transform: to }],
      { duration: V.lane === 'ground' ? 2600 : 2300, easing: 'cubic-bezier(.55,0,.8,.4)', fill: 'forwards' })
      .onfinish = done;
  }

  // live countdowns + auto fly-away 10 min after start
  setInterval(() => {
    for (const [id, entry] of active) {
      if (Date.now() > entry.r.start + 10 * 60000) remove(id);
      else update(entry);
    }
  }, 1000);

  // little chime made with WebAudio (no sound files)
  let ctx;
  function chime(notes) {
    try {
      ctx = ctx || new AudioContext();
      notes = notes || [784, 1047];
      notes.forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        const t = ctx.currentTime + i * 0.16;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.18, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
        o.connect(g).connect(ctx.destination);
        o.start(t); o.stop(t + 0.65);
      });
    } catch {}
  }

  window.sky.onReminder(show);
</script>
</body>
</html>
